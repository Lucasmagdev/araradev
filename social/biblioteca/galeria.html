<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TrilhaDev — preview do feed</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#fff;font-family:-apple-system,"Segoe UI",Roboto,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:24px}
  .phone{width:430px;max-width:100%}
  .head{display:flex;align-items:center;gap:24px;padding:16px 8px}
  .pfp{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2px solid #333}
  .stats{display:flex;gap:24px;font-size:15px}
  .stats b{display:block;font-size:18px;text-align:center}
  .bio{padding:4px 8px 16px;font-size:14px;line-height:1.5}
  .bio .name{font-weight:700}
  .bio .green{color:#58cc02}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
  .grid img{width:100%;aspect-ratio:1;object-fit:cover;display:block;cursor:pointer}
  h1{font-size:14px;color:#888;font-weight:500;margin-bottom:16px}
  .top{display:flex;align-items:center;gap:10px;padding:0 8px 8px;font-weight:700;font-size:18px}
</style></head>
<body>
  <h1>preview — como vai ficar o perfil no Instagram</h1>
  <div class="phone">
    <div class="top">trilhadev.ai</div>
    <div class="head">
      <img class="pfp" src="imagens/perfil-instagram.png">
      <div class="stats">
        <div><b>10</b>posts</div>
        <div><b>0</b>seguidores</div>
        <div><b>0</b>seguindo</div>
      </div>
    </div>
    <div class="bio">
      <div class="name">TrilhaDev | Aprender a Programar</div>
      <div>Aprenda a programar do zero</div>
      <div>1 conceito por dia, sem enrolação</div>
      <div class="green">▶ Baixe grátis na Play Store</div>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script>
    // mais recente primeiro (como o IG mostra)
    const posts=['post-10-git','post-09-erro-undefined','post-08-array','post-07-operadores',
      'post-06-tipos','post-05-funcao','post-04-loop','post-03-condicao','post-02-variavel','post-01-boasvindas'];
    document.getElementById('grid').innerHTML =
      posts.map(p=>`<img src="imagens/${p}.png" title="${p}" onclick="window.open(this.src)">`).join('');
  </script>
</body></html>
